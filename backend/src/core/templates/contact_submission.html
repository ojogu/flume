<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <title>New contact submission</title>
</head>
<body style="margin:0;padding:0;background-color:#F8F9FA;font-family:'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#F8F9FA;">
    <tr>
      <td align="center" style="padding:40px 16px;">
        <table role="presentation" width="560" cellpadding="0" cellspacing="0" style="max-width:560px;width:100%;">
          <tr>
            <td align="center" style="padding:0 0 32px 0;">
              <img src="https://flume.ojogulabs.xyz/flume_logo.png" alt="Flume" width="124" height="32" style="display:block;border:0;outline:none;">
            </td>
          </tr>
          <tr>
            <td align="center" style="background-color:#FFFFFF;border-radius:12px;padding:48px 40px;">
              <table role="presentation" width="100%" cellpadding="0" cellspacing="0">
                <tr>
                  <td align="left" style="padding:0 0 12px 0;">
                    <h1 style="margin:0;font-family:'Instrument Serif',Georgia,serif;font-style:italic;font-weight:400;font-size:28px;line-height:1.2;color:#1A1A22;letter-spacing:-0.02em;">
                      New contact submission
                    </h1>
                  </td>
                </tr>
                <tr>
                  <td align="left" style="padding:0 0 28px 0;">
                    <p style="margin:0;font-size:16px;line-height:1.6;color:#5A5A72;">
                      A user submitted the support form on the website.
                    </p>
                  </td>
                </tr>
                <tr>
                  <td align="left" style="padding:0 0 24px 0;">
                    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="border:1px solid #ECECF2;border-radius:8px;">
                      <tr>
                        <td style="padding:16px 20px;font-size:14px;line-height:1.6;color:#5A5A72;border-bottom:1px solid #ECECF2;">
                          <strong style="color:#1A1A22;">From:</strong> {{ name }} &lt;{{ email }}&gt;
                        </td>
                      </tr>
                      <tr>
                        <td style="padding:16px 20px;font-size:14px;line-height:1.6;color:#5A5A72;border-bottom:1px solid #ECECF2;">
                          <strong style="color:#1A1A22;">Subject:</strong> {{ subject }}
                        </td>
                      </tr>
                      <tr>
                        <td style="padding:16px 20px;font-size:14px;line-height:1.6;color:#5A5A72;word-break:break-word;">
                          <strong style="color:#1A1A22;">Message:</strong><br><br>
                          {{ message }}
                        </td>
                      </tr>
                    </table>
                  </td>
                </tr>
                <tr>
                  <td align="left" style="padding:0 0 0 0;">
                    <p style="margin:0;font-size:14px;line-height:1.5;color:#9090A8;">
                      Reply to the sender at <a href="mailto:{{ email }}" style="color:#1D9E75;text-decoration:underline;">{{ email }}</a>.
                    </p>
                  </td>
                </tr>
              </table>
            </td>
          </tr>
          <tr>
            <td align="center" style="padding:24px 16px 0 16px;">
              <p style="margin:0;font-size:13px;line-height:1.5;color:#9090A8;">
                &copy; {{ year }} Flume. All rights reserved.
              </p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
